# Suivi des epics — source de vérité unique
#
# Lu par AGENTS.md §2.8. Une story n'est « done » que si : code + tests +
# critères d'acceptation validés + ce fichier à jour.
#
# GitHub Projects, si on l'ouvre un jour, n'est qu'une VUE générée depuis ce
# fichier. Pas de double saisie : deux sources de vérité pour le même état,
# c'est l'état qui finit par mentir.
#
# États : backlog → in-progress → review → done   (jamais de saut)
#         + blocked quand une dépendance externe nous arrête
#
# Le champ `plan` est obligatoire dès qu'un epic passe « in-progress » :
# docs/plans/<id>-<slug>/{prd.md, architecture.md, epic-<NNN>.md}
# + story-<epic>-<n>.md pour chaque story démarrée (ADR 0007, 0009, 0011)

projet: mirofish-local-first
branche: local-first
mis_a_jour: 2026-10-03

epics:
  - id: "001"
    slug: epreuve-graphiti-local
    titre: "Épreuve Graphiti local — le modèle gratuit tient-il l'extraction ?"
    statut: in-progress
    plan: docs/plans/001-epreuve-graphiti-local
    pourquoi: >-
      Seul point de rupture du projet : la qualité du structured output de
      space-bunny-free. Tant que ce n'est pas mesuré, tout le reste est
      spéculatif.
    criteres_de_sortie:
      - "27 chunks sur 30 extraits sans erreur (90 %), sur le rapport AN n° 2506"
      - "0 échec d'authentification (MissingSessionID) sur les appels LLM"
      - "graphe non vide, et relisible après redémarrage de Neo4j"
      - "verdict go / no-go écrit dans docs/STATUS.md"
    # Story 001-1 (done) : le conflit graphiti-core/camel-oasis est réel et
    # structurel — neo4j==5.23.0 est un pin exact que graphiti-core ne peut pas
    # satisfaire, son plancher étant >=5.26.0 (et l'inverse aussi : sentence-
    # transformers==3.0.0 vs >=3.2.1). Parade mesurée et rejouable : override
    # côté uv, un seul environnement, 192 tests verts. Décision ACTÉE par l'ADR
    # 0010, précisée par l'ADR 0011. Rien n'est appliqué : la story 001-1b
    # pose le geste.
    # Le détail des stories vit dans docs/plans/001-epreuve-graphiti-local/ :
    # epic-001.md pour l'index, story-001-<n>.md pour une story démarrée.
    # Ici on ne garde que l'agrégat d'epic (ADR 0007).

  - id: "002"
    slug: interface-graphstore
    titre: "Interface GraphStore — ZepGraphStore + factory ZEP_BACKEND"
    statut: backlog
    depend_de: ["001"]
    pourquoi: >-
      ADR 0001. Tant que les services appellent le client Zep directement,
      la bascule vers Graphiti est un rewrite. C'est le chantier qui rend le
      reste réversible.

  - id: "003"
    slug: chemin-de-lecture-graphiti
    titre: "GraphitiGraphStore — écriture et chemin de lecture (ADR 0003)"
    statut: backlog
    depend_de: ["001", "002"]
    pourquoi: >-
      Sans ontologie custom, Graphiti ne pose que le label Entity, et
      zep_entity_reader.py:262 filtre tout. Le chemin de lecture est le vrai
      travail ; l'ontologie est une v2.

  - id: "004"
    slug: bascule-sans-zep
    titre: "Construire un graphe en local sans clé Zep"
    statut: backlog
    depend_de: ["003"]
    pourquoi: >-
      Preuve finale : documents → graphe → personas → simulation → rapport,
      sans ZEP_API_KEY. C'est la définition de « local-first ».

  - id: "005"
    slug: docker-local
    titre: "Docker local — Neo4j dans le compose, image qui démarre tout"
    statut: backlog
    depend_de: ["003"]
    pourquoi: >-
      Une seule commande doit lancer backend + frontend + Neo4j, avec volumes
      persistants. Piège connu : uv sync --frozen impose de régénérer le
      lock avant de construire.

  - id: "006"
    slug: migration-donnees-zep
    titre: "Migrer un graphe Zep existant — ou acter qu'on jette"
    statut: backlog
    depend_de: ["003"]
    pourquoi: >-
      Question ouverte (LOCAL-FIRST.md §11, point 3) : le graphe Zep courant
      contient-il quelque chose qui vaille la peine d'être conservé ? La
      réponse change le périmètre, donc l'epic reste ouvert tant qu'elle
      n'est pas tranchée.

  - id: "007"
    slug: ontologie-dynamique
    titre: "Ontologie dynamique (v2)"
    statut: backlog
    depend_de: ["003"]
    pourquoi: >-
      Reportée en v2 par ADR 0003. Le chemin de lecture étant fait, le
      surcoût marginal de l'ontologie devient acceptable — mais seulement si
      la v1 a livré un graphe exploitable.