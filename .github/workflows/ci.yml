name: CI

on:
  push:
    branches:
      - local-first
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked, et non --frozen : « ne pas mettre à jour le lock » n'est pas
      # « vérifier que le lock est à jour ». Sur un pyproject que le lock ne
      # satisfait pas, --frozen sort en 0 et l'image part sans la dépendance —
      # c'est exactement le piège du Dockerfile, on le laisse ici au lieu de le
      # découvrir au build. Vérifié le 4 octobre 2026 : --locked sort en 1 sur
      # le même arbre.
      - name: Sync des dépendances
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # La constitution exige des artefacts de plan par epic ; ce script est
      # la vérification. Un plan qui ne suit pas la structure casse la CI.
      - name: Structure de planification
        run: uv run python scripts/validate_plans.py

      # Aucun .env dans la CI : c'est volontaire, les tests doivent être
      # hermétiques (cf. AGENTS.md §2.2).
      #
      # Les tests du serveur Neo4j (`test_neo4j_serveur_epreuve.py`) lisent le
      # compose et les sorties versionnées, **sans démarrer de conteneur** : ils
      # gardent l'invariant statique — le serveur que le dépôt déclare reste
      # celui qui a été mesuré. Le test comportemental lui-même
      # (`scripts/verifier_driver_neo4j.py`) est hors CI : il lui faudrait un
      # service Neo4j, et ses deux sorties versionnées portent déjà la preuve.
      # C'est un choix assumé, écrit dans `test_neo4j_serveur_epreuve.py`.
      - name: Tests
        run: uv run pytest tests/ -q

  frontend:
    name: frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Lit la version dans le champ packageManager de package.json (ADR 0008)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build