name: CI

on:
  push:
    branches:
      - local-first
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen : la CI échoue si pyproject.toml et uv.lock divergent.
      # C'est exactement le piège du Dockerfile, on le laisse ici au lieu
      # de le découvrir au build de l'image.
      - name: Sync des dépendances
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # La constitution exige des artefacts de plan par epic ; ce script est
      # la vérification. Un plan qui ne suit pas la structure casse la CI.
      - name: Structure de planification
        run: uv run python scripts/validate_plans.py

      # Aucun .env dans la CI : c'est volontaire, les tests doivent être
      # hermétiques (cf. AGENTS.md §2.2).
      - name: Tests
        run: uv run pytest tests/ -q

  frontend:
    name: frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Lit la version dans le champ packageManager de package.json (ADR 0008)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build