# Compose Neo4j de l'épreuve — story 001-2.
#
# **Séparé de `docker-compose.yml` exprès.** Celui-ci pointe l'image amont
# `ghcr.io/666ghj/mirofish:latest`, ne contient pas notre code et ne contient
# pas Neo4j (AGENTS.md §2.9). Y ajouter un service `neo4j` ferait dépendre le
# test comportemental du driver forcé d'un environnement qui n'est pas le
# nôtre. Ce fichier ne sert qu'à l'épreuve ; l'epic 005 l'absorbera dans
# l'environnement de référence, quand `docker compose up` lancera vraiment tout.
#
# Lancement **depuis la racine du dépôt** — c'est là que Docker Compose cherche
# le `.env` pour l'interpolation de `${NEO4J_PASSWORD}` :
#
#     docker compose -f docker-compose.neo4j.yml up -d --wait
#     docker compose -f docker-compose.neo4j.yml ps
#     docker compose -f docker-compose.neo4j.yml stop && \
#       docker compose -f docker-compose.neo4j.yml start          # le cas C3
#     docker compose -f docker-compose.neo4j.yml down             # garde le volume
#     docker compose -f docker-compose.neo4j.yml down -v          # détruit le graphe
#
# `name:` fixe le préfixe des ressources, pour que le volume s'appelle
# `mirofish-neo4j_neo4j_data` quel que soit le répertoire d'invocation.

name: mirofish-neo4j

services:
  neo4j:
    # Tag **figé sur un patch**, et édition `community`.
    #
    # - `5.26` est le plancher que déclare `graphiti-core` (`neo4j>=5.26.0`),
    #   et une LTS : c'est le choix de `architecture.md` §4.
    # - Le patch est figé parce que `neo4j:5.26` est **flottant** : vérifié sur
    #   Docker Hub le 4 octobre 2026, il pointait déjà sur 5.26.31, et il bouge à
    #   chaque sortie. Un tag flottant dans un compose versionné signifie qu'un
    #   `up` six mois après démarre autre chose que ce qu'on a mesuré. Même
    #   raisonnement que la version résolue de l'override, consignée à côté dans
    #   `backend/pyproject.toml` (ADR 0011).
    # - `-community`, pas le tag nu : `neo4j:<version>` est l'édition
    #   Enterprise, qui réclame un accord de licence. NFR-1 vaut 0 €.
    image: neo4j:5.26.31-community

    ports:
      # Explicites, comme le veut AGENTS.md §2.9. 7474 = browser, 7687 = Bolt.
      - "7474:7474"
      - "7687:7687"

    environment:
      # Mot de passe **jamais en clair** : il vient de `.env`, qui est gitignoré
      # (AGENTS.md §2.4). Pas de `env_file` ici, et c'est délibéré — il ferait
      # entrer `LLM_API_KEY` et `ZEP_API_KEY` dans un conteneur qui n'a rien à
      # en faire. L'interpolation lit le `.env` du répertoire d'invocation.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"

      # `NEO4J_PLUGINS` installe APOC au premier démarrage. **Ce n'est pas le
      # besoin de Graphiti** — `graphiti-core==0.30.2` n'appelle aucune
      # procédure APOC, mesuré : zéro occurrence de `apoc` dans le paquet, et
      # ses procédures sont toutes natives (`db.create.setNodeVectorProperty`,
      # `db.idx.fulltext.createNodeIndex`, `db.index.fulltext.queryNodes`).
      # `architecture.md` §4 le prescrit en recopiant le compose du fork de
      # référence, sans dire pourquoi.
      #
      # La vraie raison est **`camel-oasis`** : `Neo4jGraph.__init__` appelle
      # `refresh_schema()`, qui exécute `CALL apoc.meta.data()` — et
      # `add_nodes_from_df` / `add_edges_from_df` utilisent `apoc.merge.node`,
      # `apoc.merge.relationship` et `apoc.create.addLabels`. Sans APOC, le
      # chemin Neo4j de `camel` se casse sur un `ClientError` au premier
      # `refresh_schema`. C'est mesuré au 4 octobre 2026, voir les notes de
      # complétion de `story-001-2.md`.
      #
      # Coût assumé : un téléchargement au premier `up`, une fois par machine.
      # APOC est aussi ce qui permet de mesurer que le plugin se charge
      # vraiment — sans lui, `apoc.meta.data()` échoue.
      NEO4J_PLUGINS: '["apoc"]'

      # `apoc.merge.*` et `apoc.create.*` sont des **procédures d'écriture** :
      # hors de la liste par défaut, Neo4j les refuse en `ClientError`. Sans
      # cette ligne, `camel-oasis`.write_node` échoue même avec le plugin
      # installé — le plugin présent mais muet, ce qui est pire que son absence.
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"

      # Heap borné. Sans cela, Neo4j prend la moitié de la mémoire de la VM
      # Docker Desktop, et une épreuve locale peut affamer le reste du poste.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G

    volumes:
      # Volume **nommé** : c'est la moitié du critère C3 qui ne dépend pas encore
      # de l'extraction. `down` conserve, `down -v` détruit (AGENTS.md §2.9).
      - neo4j_data:/data
      - neo4j_logs:/logs

    restart: unless-stopped

    healthcheck:
      # **Le Bolt, pas le processus.** Le healthcheck amont (`wget localhost:7474`)
      # passe dès que le HTTP écoute, donc avant que la base n'accepte une
      # transaction — et la transaction, c'est ce que le driver va faire. Ici on
      # ouvre une vraie session Bolt et on exécute une requête, avec le mot de
      # passe extrait de `NEO4J_AUTH` (`$$` : le `$` est pour le shell du
      # conteneur, pas pour l'interpolation de Compose).
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}"
          -a bolt://localhost:7687 "RETURN 1 AS sonde" > /dev/null || exit 1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

volumes:
  neo4j_data:
  neo4j_logs:
