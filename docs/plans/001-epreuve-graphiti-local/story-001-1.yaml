# Epic 001 — Story 001-1
# Une story = un fichier. L'état vit ici, pas dans sprint-status.yaml (ADR 0007).

id: "001-1"
titre: "Vérifier le conflit graphiti-core vs camel-oasis"
epic: "001"
statut: backlog              # backlog → in-progress → review → done (+ blocked)
auteur: agent

definition_of_ready:
  - ok: "Critères Given/When/Then écrits et mesurables"
    vrai: true
  - ok: "Aucune dépendance externe non résolue"
    vrai: true
  - ok: "Stratégie de test identifiée"
    vrai: true
  - ok: "Documents à consulter lus (epic-001.md, ADR 0006, config.py)"
    vrai: true

definition_of_done:
  - "graphiti-core est résolu sans conflit dans backend/.venv"
  - "camel-oasis et le driver neo4j sont importables dans le même interpréteur"
  - "154 tests toujours verts"
  - "Résultat consigné dans completion_notes, y compris si c'est un échec"
  - "Si un conflit existe : options documentées (venv séparé, service isolé) et décision proposée"

tasks:
  - id: 1
    titre: "Ajouter graphiti-core aux dépendances produit de backend/pyproject.toml"
    fait: false
  - id: 2
    titre: "Régénérer le lock (uv lock) — le Dockerfile utilise --frozen"
    fait: false
  - id: 3
    titre: "uv sync, puis vérifier qu'aucun conflit de version n'apparaît"
    fait: false
  - id: 4
    titre: "Importer camel-oasis puis neo4j dans le même interpréteur, dans cet ordre"
    fait: false
  - id: 5
    titre: "Lancer pytest tests/ -q et confirmer 154 passed"
    fait: false

notes_dev:
  architecture: >-
    On ajoute graphiti-core pour mesurer, pas pour shipping. Si le lock casse,
    on revert la dépendance : l'epic 001 doit pouvoir être annulé sans laisser
    de trace dans le dépôt.
  strategie_test: >-
    Test de cohabitation dans un seul interpréteur — c'est le seul point qui
    peut échouer ici. Aucun appel réseau, aucun Neo4j : c'est un contrôle
    d'import, pas un test fonctionnel.
  documents:
    - "docs/plans/001-epreuve-graphiti-local/epic-001.md"
    - "docs/LOCAL-FIRST.md §11 point 4 (le même obstacle, vu par l'amont)"
    - "docs/decisions/0006-docker-first.md"

risques:
