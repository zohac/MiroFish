# Epic 001 — Stories
#
# Format : une story = une unité vérifiable. Critères en Given / When / Then.
# Une story n'est « done » que si : code + tests + critères validés +
# sprint-status.yaml à jour (AGENTS.md §2.8).

epic: "001"
titre: "Épreuve Graphiti local"
plan: docs/plans/001-epreuve-graphiti-local
mis_a_jour: 2026-10-03

stories:
  - id: "001-1"
    titre: "Vérifier le conflit graphiti-core vs camel-oasis"
    statut: backlog
    depend_de: []
    criteres:
      - "Given graphiti-core ajouté au groupe dev, when uv sync s'exécute, then aucune erreur de résolution de version"
      - "Given le venv synchronisé, when pytest -q est lancé, then les 154 tests passent"
      - "Given un import de camel-oasis, when il est suivi d'un import de neo4j, then les deux coexistent"
    note: >-
      Le fork de référence a dû séparer les deux environnements (second venv +
      sous-processus). Notre venv est plus récent : à confirmer, pas à supposer.

  - id: "001-2"
    titre: "Neo4j 5.26 + APOC en local, avec volumes nommés"
    statut: backlog
    depend_de: []
    criteres:
      - "Given le compose local, when il est lancé, then le healthcheck Neo4j passe au vert"
      - "Given un nœud écrit, when le conteneur est recréé, then le nœud est toujours là (volume)"

  - id: "001-3"
    titre: "Client LLM Graphiti portant l'en-tête de session"
    statut: backlog
    depend_de: ["001-1"]
    criteres:
      - "Given un appel d'extraction via Graphiti, when l'endpoint est opencode.ai, then aucun HTTP 400 MissingSessionID"
      - "Given un endpoint non-opencode, when un appel est fait, then aucun en-tête n'est ajouté"
    note: "Critère C2 de l'épreuve. Testable sans Neo4j et sans coût."

  - id: "001-4"
    titre: "Embedder local sentence-transformers"
    statut: backlog
    depend_de: ["001-1"]
    criteres:
      - "Given l'embedder local, when un texte est encodé, then les dimensions sont stables et connues"
      - "Given l'absence d'API d'embeddings dans la config, then l'extraction fonctionne"

  - id: "001-5"
    titre: "Script de mesure reproductible + rapport versionné"
    statut: backlog
    depend_de: ["001-2", "001-3", "001-4"]
    criteres:
      - "Given le rapport AN n° 2506, when le script est lancé, then 30 chunks sont traités"
      - "Given le rapport produit, then il contient appels LLM, latences, retries, erreurs exactes"
      - "Given le rapport, then il est commité dans docs/plans/001-epreuve-graphiti-local/rapport.md"
    note: >-
      Le script vit dans backend/scripts/. Il doit être rejouable tel quel :
      pas d'état caché, pas de sortie non capturée.

  - id: "001-6"
    titre: "Verdict go / no-go documenté"
    statut: backlog
    depend_de: ["001-5"]
    criteres:
      - "Given les critères C1 à C5 du PRD, when le verdict est écrit, then il est ajouté à docs/STATUS.md"
      - "Given un no-go, when il est écrit, then un ADR est créé pour la parade choisie"
      - "Given un go, when il est écrit, then l'epic 002 passe son plan dans docs/plans/"