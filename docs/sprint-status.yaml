    # rupture du no-op de set_ontology. ADR 0014 (« Pose effective de
    # l'ontologie par GraphStore.set_ontology ») pose la décision ;
    # factory OntologyToPydantic (validation en deux temps : schéma puis
    # constructibilité, plus edge_types_from_dict) ; contrat GraphStore
    # versionné (version = 2, strict et ontology en keyword-only) ;
    # get_applied_ontology neutre et commun aux deux stores ; les deux
    # implémentations alignées par une table de conformité testée.
    # Rétrocompatibilité Epic 003 garantie : sans ontologie, add_episode
    # construit exactement l'appel d'avant (filet dédié). Mesure C1 réelle
    # sur 2 fixtures (télécom, énergie ; 5 documents chacune dont un long
    # > 20 000 caractères) : consignée dans
    # docs/plans/007-ontologie-dynamique/mesure-007-1.txt.
    # Première revue BMAD 4 couches : 23 findings (3 décisions, 16 patches,
    # 4 différés dans deferred-work.md). Le plus lourd : l'échec d'ingestion
    # réelle par propriété-map (LLM renvoyant le fragment de schéma JSON
    # d'un attribut) — filtre ajouté dans MiroFishLLMClient, 14 tests de
    # régression. Relecture BMAD 4 couches du 12 oct. 2026 (groupe A :
    # contrat/stores) : 1 décision résolue (route Zep via OntologyToPydantic
    # comme source unique de validation), 7 patches appliqués (type Zep
    # add_episode/get_applied_ontology, cycle de vie _applied_ontologies,
    # get_applied_ontology default returns None, tests miroirs Zep rejet,
    # héritage strict par _resolve_applied_ontology, strict non-bool guards,
    # route unique Zep), 2 defer (concurrence Flask threaded, piège
    # sémantique __bool__), 3 rejetés.
    # Relecture BMAD 4 couches du 12 oct. 2026 (groupe B : factory
    # OntologyToPydantic) : 12 patches appliqués (helper d'annotation
    # partagé entité/arête, validation source/target, name=None refusé,
    # références case-insensitive, reserved names Pydantic, log de troncature,
    # exception narrow, docstring, uniformité reserved names documentée,
    # newline final, 11 tests edge-type). Le défaut load-bearing : les
    # attributs d'arête étaient silencieusement forcés à `str` (détecté
    # par 3 couches, devenu load-bearing par le patch A du groupe précédent).
    # Filet global porté à 1349 sur l'hôte (+22 tests par la relecture B),
    # lint et validate_plans au vert. La table de conformité AC5 est
    # désormais construite (source unique) plutôt que déclarée.
    # Relecture BMAD 4 couches du 12 oct. 2026 (groupe C : filet LLM +
    # graph_builder + verifier) : 6 patches appliqués (wrapper
    # `set_ontology` propage `strict`, `_filtrer_champs_valides` narrow
    # Exception et validation par sous-modèle, step 6 chemin de retour
    # explicite, `_filtrer_champs_valides` écarte les champs permissifs,
    # docstring cohérente, tests pytest sur le fix
