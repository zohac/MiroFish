  - id: "012"
    slug: fiabilite-preuves-et-publication
    titre: "Fiabilité des acteurs, intégrité des preuves et publication stricte"
    statut: done
    plan: docs/plans/012-fiabilite-preuves-et-publication
    depend_de: ["005", "007", "008", "009", "010", "011"]
    pourquoi: >-
      Éliminer les collisions d'identités (Agent_1 absorbé par Agent_16), filtrer et dédoublonner
      la cohorte cible (exclure entités inéligibles et alias techniques dupliqués), qualifier
      honnêtement les décisions et rôles (zéro adoption fictive sans action probante), réconcilier
      de façon robuste les affirmations avec l'EvidencePack (supprimer les 0 VERIFIED), et durcir
      la barrière de publication en mode fail-closed avec statuts explicites (draft, needs_review,
      verified_publishable, failed_validation).
    criteres_de_sortie:
      - "C1 : Zéro collision d'identités (Agent_1 vs Agent_16 strictement disjoints)"
      - "C2 : Cohorte d'intérêt filtrée (eligible == True) et dédoublonnée (0 alias Agent_X dupliqué avec persona nommé)"
      - "C3 : Rôles fidèles (fondateur non prospect) et statuts d'adoption étayés (0 ADOPTED par simple absence d'objection)"
      - "C4 : Réconciliation déterministe des claims avec l'EvidencePack (taux >= 80% sur actions observées nominales)"
      - "C5 : Barrière de publication fail-closed (0 publication certifiée avec 0 claim vérifié)"
      - "C6 : Prévalence absolue du type épistémique des sources sur les rôles génériques"
      - "C7 : Détection et invalidation propre sur fixture de non-régression du run réel R6"
      - "C8 : 1 761 tests existants au vert + nouvelle suite hermétique dédiée (>= 1 785 tests au vert sur l'hôte)"
    # Story 012-1 (DONE) : résolution stricte des identités d'acteurs et couverture de cohorte sans collision (AgentIdentityResolver, normalisation canonique Unicode NFKD stricte == sans inclusion par sous-chaîne, 23 événements d'Agent_1 et 18 d'Agent_16 strictement disjoints, filtrage des entités inéligibles Stripe/CPAM, dédoublonnage des alias techniques Agent_X en faveur des personas nommés et attribution univoque d'event_id). 11 tests hermétiques dédiés (test_cohort_identity_resolution.py). Revue contradictoire BMAD 4 couches validée avec 4 patches appliqués (sécurisation falsy 0, conversion int défensive, garde simulation_id vide, initialisation complète alias/noms). Filet global porté à 1 771 tests passants sur l'hôte (+ 9 tests Node frontend). Epic 012 in-progress (1/6 stories done).
    # Story 012-2 (DONE) : rôles de scénario et statuts de décision d'adoption déterministes (suppression définitive du forçage aveugle ActorRole.PERSON -> ScenarioRole.PROSPECT au profit d'une hiérarchie brief > config > selection > UNKNOWN ; enrichissement de ScenarioRole et DecisionStatus avec rétrocompatibilité transparente ADOPTED/REJECTED/UNDECIDED ; attribution d'office de NOT_APPLICABLE pour fondateurs, collaborateurs et institutions ; règle anti-affabulation C3 interdisant catégoriquement l'inférence d'ADOPTED par simple absence d'objection au profit de NO_DECISION/INTERESTED ; détection probante d'ADOPTED_VERIFIED, DEMO_REQUESTED, REJECTED_EXPRESSED ; assainissement du calcul d'adoption_rate excluant strictement NOT_APPLICABLE du dénominateur). 14 tests hermétiques dédiés (test_cohort_roles_and_decisions.py). Revue contradictoire BMAD 4 couches validée avec 5 patches appliqués (analyse sur texte d'action complet sans troncature, regex fondateurs robuste, motifs d'adoption et intérêt enrichis, O(1) cls.__members__, casse insensible from_actor_role). Filet global porté à 1 785 tests passants sur l'hôte (+ 9 tests Node frontend). Epic 012 in-progress (2/6 stories done).
    # Story 012-3 (DONE) : extraction d'assertions assainie et réconciliation déterministe avec l'EvidencePack (élimination catégorique des faux agents « Si », « Dès », titres Markdown et mots parasites ; validation nominative stricte par AgentIdentityResolver / get_known_names ; extraction d'actions sans dépendance d'identifiants techniques evt_* en dur ; réconciliation déterministe avec l'EvidencePack par acteur résolu univoquement, round et correspondance sémantique/verbatim ; règle anti-affabulation C4 avec déclassement motivé en REPORTED_INTENTION / UNSUPPORTED et justification explicite dans limitations ; interdiction d'assimiler un post social à une transaction d'achat ; 15 tests hermétiques dédiés dans test_report_claims_reconciliation.py). Revue contradictoire BMAD 4 couches validée avec 10 patches appliqués (recherche délimitée \b prioritaire des personas canoniques, suppression des tokens parasites de tête de phrase en regex, élimination du in par sous-chaîne dans verify_simulated_citation, harmonisation du libellé de limitation, filtre d'agent sur evidence_refs, contrôle sémantique unquoted claims, résolution d'alias citation, etc.). Filet global porté à 1 800 tests passants sur l'hôte (+ 9 tests Node frontend). Epic 012 in-progress (3/6 stories done).
    # Story 012-4 (DONE) : barrière de publication Fail-Closed et statuts de certification du rapport (modélisation formelle PublicationStatus avec 4 états : draft, needs_review, verified_publishable, failed_validation ; conditionnement strict de is_publishable = True à l'état verified_publishable ; rejet immédiat en failed_validation pour l'anomalie R6 avec 0 claim vérifié / QA-08 ; gestion stricte de l'absence de registre report_claims.json en échec si actions simulées relatées / QA-09 ; seuils stricts >= 80% pour verified_publishable, 50-79% pour needs_review, < 50% pour failed_validation ; interdiction d'affabulation commerciale bloquant ADOPTED_VERIFIED non corroboré ; désérialisation rétrocompatible sans régression ; IHM Step4Report.vue réactive avec badges et cartes de statut ; i18n trilingue fr/en/zh ; 31 tests hermétiques au vert dans test_report_quality_gate_audit.py). Revue contradictoire BMAD 4 couches validée avec 7 patches appliqués. Filet global porté à 1 812 tests passants sur l'hôte (+ 9 tests Node frontend). Epic 012 in-progress (4/6 stories done).
    # Story 012-5 (DONE) : séparation épistémique des sources, intégrité du brief et détection de contradictions (prévalence stricte du type épistémique EpistemicSourceKind sur DocumentRole interdisant formellement qu'un persona ou scénario produise DOCUMENTARY au profit d'HYPOTHESIS / QA-10 ; audit structuré du manifeste audit_source_manifest détectant METADATA_ROLE_EPISTEMIC_MISMATCH et EMPTY_OR_UNCHUNKED_SOURCE avec typage défensif sur total_chunks ; inférence universelle déterministe d'horizon temporel extract_inferred_horizon avec accord grammatical et détection de lacunes audit_brief avec repli unknown / QA-11 ; restitution exhaustive de toutes les sources déclarées dans ReportAgent.build_sources_provenance_section y compris sans fragments ; contrat de faits non négociables d'entreprise check_company_facts_contradiction et déclassement immédiat en CONTRADICTED pour FOUNDER / TEAM_MEMBER / QA-12 avec lecture directe des textes sur disque, découpage propositionnel insensible aux décimaux et normalisation des élisions dans _content_terms ; 15 tests hermétiques dédiés dans test_epistemic_sources_and_brief.py). Revue contradictoire BMAD 4 couches validée avec 5 patches appliqués. Filet global porté à 1 827 tests passants sur l'hôte (+ 9 tests Node frontend). Epic 012 in-progress (5/6 stories done).
    # Story 012-6 (DONE) : clôture définitive de la story 012-6 et de l'Epic 012 (« Fiabilité des acteurs, intégrité des preuves et publication stricte »). Script autonome d'orchestration backend/scripts/verifier_qualification_epic_012.py validant séquentiellement 100 % des critères C1 à C8. Fixture synthétique anonymisée de l'audit R6 r6_bundle (10 artefacts sous backend/tests/fixtures/qualification_epic_012/r6_bundle/, 786 événements, 44 entités) sans aucune fuite de clés ou tokens (NFR-1). Invalidation Fail-Closed catégorique prouvée de l'ancien export erroné (rejet en failed_validation / C7 / QA-08 / QA-13) et passage conforme en verified_publishable du run réconcilié. Complétude et étanchéité de run_manifest.json (commit Git résolu, completed_at ISO 8601, time_horizon cohérent, 0 secret fuité). Rapport formel docs/plans/012-fiabilite-preuves-et-publication/rapport-qualification-epic-012.md consigné avec VERDICT GO. Suite hermétique dédiée (backend/tests/test_verifier_qualification_epic_012.py, 15 tests unitaires passants). Revue contradictoire BMAD 4 couches validée (4 patches appliqués). Filet global de tests porté à 1 842 tests unitaires et d'intégration au vert sur l'hôte (0 échec) + 9 tests Node frontend. Epic 012 intégralement clos avec succès (6/6 stories done).

  - id: "013"
    slug: benchmark-llm-report-replay
    titre: "Benchmark LLM du ReportAgent et régénération non destructive sur simulation existante"
    statut: in-progress
    plan: docs/plans/013-benchmark-llm-report-replay
    depend_de: ["005", "007", "008", "009", "010", "011", "012"]
    pourquoi: >-
      Mesurer et isoler scientifiquement l'impact de la qualité des modèles LLM et de l'effort de
      raisonnement (gemini-3.8-flash medium vs high) sur le ReportAgent sans relancer OASIS ni
      recalculer les graphes, via un mode replay à preuves figées (replay_frozen sur run R7),
      une configuration LLM dédiée par job (ReportLLMProfile), l'isolation étanche de chaque
      rapport sous reports/<report_id>/ et un banc de qualification A/B.
    criteres_de_sortie:
      - "C1 : Configuration LLM découplée par instance de ReportAgent (ReportLLMProfile) sans altération globale d'os.environ"
      - "C2 : Transmission et prise en compte effective de reasoning_effort (medium vs high) y compris via la passerelle Antigravity locale et OpenCode GO"
      - "C3 : Mode replay isolé (replay_frozen) s'exécutant sur des preuves figées sans interactions OASIS live"
      - "C4 : Isolation multi-rapports par report_id sans écrasement destructif des anciens rapports, claims et audits"
      - "C5 : Suivi des consommations et garde-fous budgétaires (tokens, durée, coût estimé, plafond par job)"
      - "C6 : IHM Step4Report permettant la sélection d'un profil de régénération, l'historique et la comparaison des versions"
      - "C7 : Campagne de benchmark contrôlée comparant gemini-3.8-flash medium vs high sur R7 avec rapport formel et analyse aveugle"
      - "C8 : Préservation de l'intégralité du filet de tests (>= 1 842 tests hôte + 9 tests Node frontend au vert)"
