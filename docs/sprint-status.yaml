# Suivi des epics — source de vérité unique
#
# Lu par AGENTS.md §2.8. Ce fichier porte l'agrégat des epics ; l'état d'une
# story vit dans son fichier. Sa clôture exige code, tests, revue et critères
# d'acceptation validés, puis actualisation de l'agrégat si nécessaire.
#
# GitHub Projects, si on l'ouvre un jour, n'est qu'une VUE générée depuis ce
# fichier. Pas de double saisie : deux sources de vérité pour le même état,
# c'est l'état qui finit par mentir.
#
# États : backlog → in-progress → review → done   (jamais de saut)
#         + blocked quand une dépendance externe nous arrête
#
# Le champ `plan` est obligatoire dès qu'un epic passe « in-progress » :
# docs/plans/<id>-<slug>/{prd.md, architecture.md, epic-<NNN>.md}
# + story-<epic>-<n>.md pour chaque story démarrée (ADR 0007, 0009, 0011)

