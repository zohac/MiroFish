  - id: "006"
    slug: migration-donnees-zep
    titre: "Migrer un graphe Zep existant — ou acter qu'on jette"
    statut: backlog
    depend_de: ["003"]
    pourquoi: >-
      Question ouverte (LOCAL-FIRST.md §11, point 3) : le graphe Zep courant
      contient-il quelque chose qui vaille la peine d'être conservé ? La
      réponse change le périmètre, donc l'epic reste ouvert tant qu'elle
      n'est pas tranchée.

  - id: "007"
    slug: ontologie-dynamique
    titre: "Ontologie dynamique (v2)"
    statut: backlog
    depend_de: ["003"]
    pourquoi: >-
      Reportée en v2 par ADR 0003. Le chemin de lecture étant fait, le
      surcoût marginal de l'ontologie devient acceptable — mais seulement si
