# Suivi des epics — source de vérité unique
#
# Lu par AGENTS.md §2.8. Une story n'est « done » que si : code + tests +
# critères d'acceptation validés + ce fichier à jour.
#
# GitHub Projects, si on l'ouvre un jour, n'est qu'une VUE générée depuis ce
# fichier. Pas de double saisie : deux sources de vérité pour le même état,
# c'est l'état qui finit par mentir.
#
# États : backlog → in-progress → review → done   (jamais de saut)
#         + blocked quand une dépendance externe nous arrête
#
# Le champ `plan` est obligatoire dès qu'un epic passe « in-progress » :
# docs/plans/<id>-<slug>/{prd.md, architecture.md, epic-<NNN>.md}
# + story-<epic>-<n>.md pour chaque story démarrée (ADR 0007, 0009, 0011)

projet: mirofish-local-first
branche: local-first
mis_a_jour: 2026-10-09

epics:
  - id: "001"
    slug: epreuve-graphiti-local
    titre: "Épreuve Graphiti local — le modèle gratuit tient-il l'extraction ?"
    statut: done
    plan: docs/plans/001-epreuve-graphiti-local
    pourquoi: >-
      Seul point de rupture du projet : la qualité du structured output de
      space-bunny-free. Tant que ce n'est pas mesuré, tout le reste est
      spéculatif.
    criteres_de_sortie:
      - "27 chunks sur 30 extraits sans erreur (90 %), sur le rapport AN n° 2506"
      - "0 échec d'authentification (MissingSessionID) sur les appels LLM"
      - "graphe non vide, et relisible après redémarrage de Neo4j"
      - "verdict go / no-go écrit dans docs/STATUS.md"
    # Story 001-1 (done) : le conflit graphiti-core/camel-oasis est réel et
    # structurel — neo4j==5.23.0 est un pin exact que graphiti-core ne peut pas
    # satisfaire, son plancher étant >=5.26.0 (et l'inverse aussi : sentence-
    # transformers==3.0.0 vs >=3.2.1). Parade mesurée et rejouable : override
    # côté uv, un seul environnement, 192 tests verts à l'époque. Décision ACTÉE
    # par l'ADR 0010, précisée par l'ADR 0011.
    # Story 001-1b (done) : l'override est POSÉ, relu et corrigé.
    # pyproject.toml porte override-dependencies = ["neo4j>=5.26.0,<6.0.0"]
    # avec neo4j 5.28.6 en commentaire, graphiti-core==0.30.2 est en
    # dépendance produit SANS extra, et le lock est régénéré et commité.
    # Le protocole mesurer-001-1.sh a dû être réécrit : il exigeait
    # graphiti-core absent et ajoutait un second [tool.uv]. Il normalise
    # maintenant pyproject.toml dans l'état qu'il veut mesurer, refuse un
    # arbre ambigu, et a été rejoué sur les deux arbres — les deux sorties
    # sont versionnées. Revue par 4 couches : 5 findings bloquants, tous
    # corrigés (dont --frozen qui ne vérifiait pas le lock, et la télémétrie
    # posthog activée par défaut, désactivée depuis). 234 tests, +30 de
    # revue (204 au premier jet de la story).
    # Story 001-2 (DONE) : le driver forcé TIENT. Neo4j 5.26.31-
    # community dans un compose SÉPARÉ (docker-compose.neo4j.yml), tag figé sur
    # un patch, écart driver 5.28.6 / serveur 5.26.31 consigné et gardé par un
    # test. 17 contrôles, deux fois : surface de l'ADR 0011 EXERCÉE (pas
    # importée), hiérarchie d'exceptions comprise, et le nœud survit à stop puis
    # start — C3 prouvé pour la moitié qui ne dépend pas de l'extraction.
    # L'ADR 0010 N'EST PAS SUPERSÉDÉ.
    # Trois trouvailles : (1) Neo4jError et DriverError sont SOeurs sous GqlError,
    # pas une chaîne — le contrôle l'a montré, c'est le test qui avait tort ;
    # (2) graphiti-core appelle CALL db.indexes(), qui N'EXISTE PAS sur un 5.x —
    # c'est delete_all_indexes, hors chemin d'écriture, mais la 001-5 doit le
    # savoir avant de choisir sa remise à zéro ; (3) APOC a DEUX réponses, pas
    # une : graphiti-core s'en passe (zéro occurrence dans le paquet), camel-oasis
    # en a besoin (apoc.meta.data au __init__, apoc.merge.node à l'écriture) — le
    # plugin reste, pour la raison que architecture.md §4 ne donnait pas. Corrigé
    # aussi : apoc.merge.* est refusé par défaut même plugin installé.
    # 277 tests (+42). Les tests d'intégration ne sont pas en CI : ils lisent le
    # compose et les deux sorties versionnées, la preuve d'exécution reste
    # rejouable à la main.
    # 001-2 relue par 4 couches : 28 correctifs, dont six garde-fous morts et un C3
    # qui ne tenait que par coïncidence. 279 tests (+45). Mesures rejouées.
    # Story 001-3 (DONE) : MiroFishLLMClient implémenté, validé et relu.
    # OpenAIGenericClient sous-classé avec injection de default_headers
    # (x-opencode-session, User-Agent), neutralité préservée (base_url=None), mode
    # structured_output_mode="json_object" par défaut, filtrage des balises <think>
    # et transmission de LLM_REASONING_EFFORT via extra_body. Sonde de
    # vérification autonome fiabilisée (scripts/verifier_llm_graphiti.py). Critère C2
    # validé (0 échec MissingSessionID). Revue 4 couches passée (6 correctifs).
    # 296 tests (+17).
    # Story 001-4 (DONE) : SentenceTransformerEmbedder implémenté et validé.
    # Adaptateur local sous-classant EmbedderClient sans extra ni conflit
    # (sentence-transformers==3.0.0 déjà fourni par camel-oasis). Modèle par défaut
    # all-MiniLM-L6-v2 (384 dim, 0 € marginal), lazy-loading thread-safe, délégation
    # asynchrone via asyncio.to_thread, conversion rigoureuse en list[float]. Sonde
    # autonome de vérification (scripts/verifier_embedder_graphiti.py) avec mode --mock
    # et intégration conjointe Graphiti sans clé OpenAI validées. Revue de code
    # contradictoire passée (4 couches, 6 correctifs). 315 tests (+18).
    # Story 001-5 (DONE) : banc de mesure autonome (scripts/mesurer_extraction_graphiti.py)
    # exécuté en conditions réelles sur les 30 premiers chunks du rapport AN n° 2506
    # avec space-bunny, all-MiniLM-L6-v2 et Neo4j 5.26. Résultats : C1 = 29/30 (96.7 % >= 90 %),
    # C2 = 0 échec MissingSessionID, C3 = 49 nœuds et 45 relations persistés et relus,
    # C4 = 11 arêtes avec valid_at renseigné, C5 = rapport.md versionné avec verdict GO.
    # Revue BMad 4 couches validée (8 patchs appliqués). 333 tests (+18).
    # Story 001-6 (DONE) : verdict formel GO documenté dans docs/STATUS.md et clôture
    # de l'epic 001. Hypothèse confirmée : extraction fonctionnelle à coût marginal 0 €.
    # Synchronisation complète de la documentation d'état et des référentiels.
    # Epic 001 clos, Epic 002 débloqué pour cadrage et démarrage.
    # Le détail des stories vit dans docs/plans/001-epreuve-graphiti-local/ :
    # epic-001.md pour l'index, story-001-<n>.md pour une story démarrée.
    # Ici on ne garde que l'agrégat d'epic (ADR 0007).

  - id: "002"
    slug: interface-graphstore
    titre: "Interface GraphStore — ZepGraphStore + factory ZEP_BACKEND"
    statut: done
    plan: docs/plans/002-interface-graphstore
    depend_de: ["001"]
    pourquoi: >-
      ADR 0001. Tant que les services appellent le client Zep directement,
      la bascule vers Graphiti est un rewrite. C'est le chantier qui rend le
      reste réversible.
    criteres_de_sortie:
      - "Interface GraphStore définie et typée sans dépendance Zep"
      - "ZepGraphStore implémente 100 % du contrat existant"
      - "Factory get_graph_store() pilotée par ZEP_BACKEND (défaut 'cloud')"
      - "0 import direct du SDK Zep dans les services et routes API"
      - "100 % des tests existants restent verts (333 tests)"
    # Story 002-1 (DONE) : interface abstraite pure GraphStore (14 méthodes),
    # modèles neutres immutables (GraphNode, GraphEdge, GraphSearchResult,
    # EpisodeRecord, BatchSubmissionRecord, GraphInfo) et hiérarchie d'exceptions
    # agnostiques GraphStoreError posés dans backend/app/utils/graph_store/.
    # Zéro dépendance vers zep_cloud (prouvé par AST). Suite de tests unitaires
    # complète (test_graph_store_contract.py) avec FakeGraphStore. Revue BMad à
    # 4 couches validée (7 correctifs appliqués). 341 tests verts (+8).
    # Story 002-2 (DONE) : implémentation complète de ZepGraphStore
    # (backend/app/utils/graph_store/zep_store.py) encapsulant les 14 méthodes
    # de GraphStore, la pagination par curseurs, la réconciliation et la
    # traduction exhaustive des exceptions vers GraphStoreError. 68 tests
    # unitaires hermétiques (backend/tests/test_zep_graph_store.py). Revue BMad à
    # 4 couches validée (6 patchs appliqués). 409 tests verts (+68).
    # Story 002-3 (DONE) : factory centralisée get_graph_store()
    # (backend/app/utils/graph_store/factory.py) avec résolution de priorité,
    # normalisation insensible à la casse et tolérance aux espaces, aiguillage
    # ZEP_BACKEND ('cloud' par défaut, réservation 'graphiti' Epic 003),
    # validation stricte dans Config.validate(), et mécanisme d'override
    # étanche (set_graph_store_override avec contrôle de type, override_graph_store).
    # 33 tests unitaires hermétiques (backend/tests/test_graph_store_factory.py).
    # Story 002-4 (DONE) : refactoring des flux d'ingestion et d'écriture
    # (backend/app/services/graph_builder.py, zep_graph_memory_updater.py,
    # simulation_runner.py). Découplage total de zep_cloud et utils.zep au profit
    # de GraphStore et get_graph_store(). Gestion fine de l'héritage d'exceptions
    # GraphStoreError(RuntimeError) et GraphTimeoutError(TimeoutError). Revue BMad
    # 4 couches validée (8 patchs appliqués). 10 tests unitaires avec MockIngestionStore
    # (tests/test_graph_builder_refactor.py). 452 tests verts (+10). Clôture (done).
    # Story 002-5 (DONE) : refactoring des flux de lecture et d'interrogation
    # (backend/app/services/zep_entity_reader.py, oasis_profile_generator.py,
    # zep_tools.py, api/graph.py). Découplage total de zep_cloud et utils.zep
    # au profit de GraphStore et get_graph_store(). Préservation rétrocompatible
    # des properties d'accès et conversion neutre vers les structures métier.
    # Revue BMad 4 couches validée (4 patchs appliqués). 12 tests hermétiques avec MockReaderStore
    # (tests/test_graph_reader_refactor.py). 464 tests verts (+12). Clôture (done).
    # Story 002-6 (DONE) : suite de tests d'isolation permanente
    # (backend/tests/test_graph_store_isolation.py), contrôle syntaxique AST
    # garantissant 0 import direct du SDK Zep dans app/services/ et app/api/,
    # 0 bifurcation conditionnelle dans la logique métier, validation des critères
    # C1 à C6 du PRD, non-régression absolue (470 tests verts) et clôture formelle
    # de l'Epic 002.



  - id: "003"
    slug: chemin-de-lecture-graphiti
    titre: "GraphitiGraphStore — écriture et chemin de lecture (ADR 0003)"
    statut: done
    plan: docs/plans/003-chemin-de-lecture-graphiti
    depend_de: ["001", "002"]
    pourquoi: >-
      Sans ontologie custom, Graphiti ne pose que le label Entity, et
      zep_entity_reader.py:262 filtre tout. Le chemin de lecture est le vrai
      travail ; l'ontologie est une v2.
    # Story 003-1 (DONE) : classe GraphitiGraphStore et LocalPassthroughCrossEncoder
    # implémentées dans backend/app/utils/graph_store/graphiti_store.py. Les 14 méthodes
    # du contrat GraphStore sont formellement déclarées avec signatures strictes.
    # Constructeur avec support complet d'injection de dépendances (driver, llm_client,
    # embedder, cross_encoder, graphiti) et validation des variables d'environnement
    # (NEO4J_URI, NEO4J_USER, NEO4J_PASSWORD). Passerelle synchrone / asynchrone thread-safe
    # _run_async implémentée avec gestion des boucles actives. Activation de ZEP_BACKEND='graphiti'
    # dans la factory get_graph_store() et export dans __init__.py. Suite de 23 tests unitaires
    # hermétiques (test_graphiti_graph_store.py). Revue BMad 4 couches validée (5 patchs appliqués).
    # Filet porté à 494 tests verts (+24).
    # Story 003-2 (DONE) : implémentation du cycle de vie (create_graph,
    # delete_graph, set_ontology) et de l'ingestion d'épisodes (add_episode,
    # add_text_batch, wait_for_batch, wait_for_episodes) avec partitionnement
    # strict par group_id = graph_id (Critère C2, NFR-3). Validation de l'isolation
    # étanche entre graphes, normalisation ISO 8601 UTC des timestamps (gestion 'Z' et 'z'),
    # optimisation d'index Cypher :Episodic, gestion des erreurs et 27 nouveaux
    # tests unitaires hermétiques dans test_graphiti_graph_store.py (50 tests sur le
    # fichier). Revue BMad 4 couches validée (5 patchs appliqués). Filet porté à
    # 521 tests verts (+27).
    # Story 003-3 (DONE) : implémentation de la lecture Cypher (get_all_nodes,
    # get_all_edges), des parcours de voisinage (get_node, get_node_edges),
    # de l'agrégation pour l'API / frontend (get_graph_data, get_graph_info)
    # et de la recherche hybride temporelle (search avec scopes edges, nodes,
    # hybrid). Respect strict de la temporalité (valid_at, invalid_at, expired_at,
    # created_at), résolution des noms de nœuds connectés, partitionnement étanche
    # group_id = graph_id sur 100 % des requêtes Cypher et 24 nouveaux tests
    # unitaires hermétiques dans test_graphiti_graph_store.py (74 tests sur le fichier).
    # Revue BMad 4 couches validée (6 patchs appliqués). Filet global porté à 545 tests verts (+24).
    # Story 003-4 (DONE) : adaptation de la lecture d'entités (zep_entity_reader.py,
    # EntityNode, GraphNode) pour supporter le typage agnostique et les entités
    # génériques Graphiti (:Entity). Levée du filtrage aveugle qui rejetait 100 % des nœuds
    # Graphiti, chaîne de résolution ordonnée de get_entity_type (labels spécifiques > attributs > Entity),
    # filtrage filter_defined_entities avec ou sans defined_entity_types, compatibilité avec
    # simulation_config_generator et oasis_profile_generator. 10 nouveaux tests unitaires hermétiques
    # dédiés (test_zep_entity_reader_graphiti.py). Revue BMad validée (3 patchs appliqués). Filet global porté à 555 tests verts (+10).
    # Story 003-5 (DONE) : banc d'intégration réelle (backend/scripts/verifier_integration_graphiti.py)
    # validé sur l'instance Neo4j locale (docker-compose.neo4j.yml). 100 % des 14 méthodes du contrat
    # GraphStore exercées avec succès (C1), partitionnement multi-tenant étanche prouvé (0 fuite, C2),
    # métadonnées temporelles préservées (C3), extraction ZepEntityReader opérationnelle sur graphe réel (C4),
    # instanciation transparente via factory (C5), filet étendu à 562 tests unitaires et d'intégration
    # hermétiques verts (+7 tests, test_verifier_integration_graphiti.py, test_graphiti_graph_store.py) (C6).
    # Runner thread-safe _AsyncLoopRunner intégré dans GraphitiGraphStore. Revue BMad validée (2 patchs appliqués).
    # Rapport de validation versionné avec VERDICT GO. Epic 003 intégralement clos avec succès (5/5 stories done).

  - id: "004"
    slug: bascule-sans-zep
    titre: "Construire un graphe en local sans clé Zep"
    statut: done
    plan: docs/plans/004-bascule-sans-zep
    depend_de: ["003"]
    pourquoi: >-
      Preuve finale : documents → graphe → personas → simulation → rapport,
      sans ZEP_API_KEY. C'est la définition de « local-first ». Paramétrabilité
      universelle du LLM via .env (endpoint, modèle, clé, effort de raisonnement)
      avec OpenCode Go space-bunny-free en environnement de référence.
    # Story 004-1 (DONE) : paramétrabilité universelle du LLM via .env (endpoint,
    # modèle, clé, effort de raisonnement). Intégration de LLM_REASONING_EFFORT dans Config,
    # alignement de la résolution des paramètres entre LLMClient et MiroFishLLMClient,
    # neutralité stricte prouvée (x-opencode-session émis UNIQUEMENT pour opencode.ai
    # et ses sous-domaines, en-têtes neutres pour les tiers OpenAI, DeepSeek, Groq, Ollama),
    # et suite de tests unitaires dédiée. Filet global porté à 577 tests verts (+15, revue BMad validée).
    # Story 004-2 (DONE) : levée des gardes ZEP_API_KEY dans les routes API et les services
    # métiers. Helper Config.requires_zep_api_key() posé, gardes bloquants 500 levés dans
    # api/graph.py (/build, /data, /delete) et api/simulation.py (/entities, /entities/<uuid>,
    # /entities/by-type) lorsque ZEP_BACKEND='graphiti', et non-régression Zep Cloud préservée.
    # GraphBuilderService, ZepEntityReader, OasisProfileGenerator, ZepGraphMemoryUpdater et
    # ZepToolsService s'instancient sans clé en mode graphiti. Suite de 24 tests unitaires et
    # d'API dédiée (test_zep_api_key_guards.py). Filet global porté à 601 tests verts (+24, revue BMad validée).
    # Story 004-3 (DONE) : ingestion et construction de graphe de bout en bout avec
    # GraphitiGraphStore et GraphBuilderService. Tâche asynchrone /api/graph/build validée
    # de bout en bout avec transitions d'état du projet (GRAPH_COMPLETED), TaskManager et
    # route de restitution GET /api/graph/data/<graph_id>. Banc d'ingestion réelle contre Neo4j
    # local validé (scripts/verifier_ingestion_graphiti.py) avec critère C3 formellement
    # satisfait (6 nœuds >= 5, 4 arêtes >= 3). Suite de 13 tests unitaires et de non-régression
    # (test_graph_builder_e2e.py, test_verifier_ingestion_graphiti.py). Revue BMad validée (5 patchs).
    # Filet global porté à 614 tests verts (+13).
    # Story 004-4 (DONE) : extraction d'entités, génération de personas et configuration
    # de simulation sans Zep. ZepEntityReader extrait les entités typées et arêtes sans Zep,
    # OasisProfileGenerator produit les profils personas Reddit JSON et Twitter CSV conformes
    # aux spécifications OASIS, et SimulationConfigGenerator génère simulation_config.json.
    # Route /api/simulation/create et méthode prepare_simulation opérationnelles sans clé Zep.
    # Banc de vérification réelle contre Neo4j local (scripts/verifier_personas_simulation_graphiti.py)
    # validé avec succès (critère C4 formellement satisfait : 4 personas >= 3, formats valides).
    # Suite de 10 nouveaux tests unitaires hermétiques (test_personas_simulation_graphiti.py,
    # test_verifier_personas_protocol.py). Revue BMad 4 couches validée avec 4 patchs appliqués. Filet global porté à 624 tests verts (+10).
    # Story 004-5 (DONE) : banc de qualification globale local-first (backend/scripts/verifier_qualification_local_first.py)
    # validant l'intégralité du cycle local-first sans clé Zep (100 % des critères C1 à C5 satisfaits) :
    # 0 blocage API (C1), paramétrabilité universelle LLM et neutralité d'hôte (C2), graphe Neo4j réel construit (6 nœuds, 4 arêtes, C3),
    # 6 personas Reddit JSON et Twitter CSV OASIS conformes et config de simulation complète (C4),
    # filet étendu à 632 tests unitaires et d'intégration hermétiques au vert (+8 tests, test_verifier_qualification_protocol.py et revue BMad 5 patchs) (C5).
    # Rapport de qualification consigné (rapport-qualification-epic-004.md) avec VERDICT GO. Epic 004 clos avec succès (5/5 stories done).


  - id: "005"
    slug: docker-local
    titre: "Environnement Docker de référence — Docker-first"
    statut: in-progress
    plan: docs/plans/005-docker-local
    depend_de: ["001", "002", "003", "004"]
    pourquoi: >-
      Une seule commande doit lancer backend + frontend + Neo4j, avec volumes
