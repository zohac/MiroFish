epics:
  - id: "001"
    slug: epreuve-graphiti-local
    titre: "Épreuve Graphiti local — le modèle gratuit tient-il l'extraction ?"
    statut: done
    plan: docs/plans/001-epreuve-graphiti-local
    pourquoi: >-
      Seul point de rupture du projet : la qualité du structured output de
      space-bunny-free. Tant que ce n'est pas mesuré, tout le reste est
      spéculatif.
    criteres_de_sortie:
      - "27 chunks sur 30 extraits sans erreur (90 %), sur le rapport AN n° 2506"
      - "0 échec d'authentification (MissingSessionID) sur les appels LLM"
      - "graphe non vide, et relisible après redémarrage de Neo4j"
      - "verdict go / no-go écrit dans docs/STATUS.md"
    # Story 001-1 (done) : le conflit graphiti-core/camel-oasis est réel et
    # structurel — neo4j==5.23.0 est un pin exact que graphiti-core ne peut pas
    # satisfaire, son plancher étant >=5.26.0 (et l'inverse aussi : sentence-
    # transformers==3.0.0 vs >=3.2.1). Parade mesurée et rejouable : override
    # côté uv, un seul environnement, 192 tests verts à l'époque. Décision ACTÉE
    # par l'ADR 0010, précisée par l'ADR 0011.
    # Story 001-1b (done) : l'override est POSÉ, relu et corrigé.
    # pyproject.toml porte override-dependencies = ["neo4j>=5.26.0,<6.0.0"]
    # avec neo4j 5.28.6 en commentaire, graphiti-core==0.30.2 est en
    # dépendance produit SANS extra, et le lock est régénéré et commité.
    # Le protocole mesurer-001-1.sh a dû être réécrit : il exigeait
    # graphiti-core absent et ajoutait un second [tool.uv]. Il normalise
    # maintenant pyproject.toml dans l'état qu'il veut mesurer, refuse un
    # arbre ambigu, et a été rejoué sur les deux arbres — les deux sorties
    # sont versionnées. Revue par 4 couches : 5 findings bloquants, tous
    # corrigés (dont --frozen qui ne vérifiait pas le lock, et la télémétrie
    # posthog activée par défaut, désactivée depuis). 234 tests, +30 de
    # revue (204 au premier jet de la story).
    # Story 001-2 (DONE) : le driver forcé TIENT. Neo4j 5.26.31-
    # community dans un compose SÉPARÉ (docker-compose.neo4j.yml), tag figé sur
    # un patch, écart driver 5.28.6 / serveur 5.26.31 consigné et gardé par un
    # test. 17 contrôles, deux fois : surface de l'ADR 0011 EXERCÉE (pas
    # importée), hiérarchie d'exceptions comprise, et le nœud survit à stop puis
    # start — C3 prouvé pour la moitié qui ne dépend pas de l'extraction.
    # L'ADR 0010 N'EST PAS SUPERSÉDÉ.
    # Trois trouvailles : (1) Neo4jError et DriverError sont SOeurs sous GqlError,
    # pas une chaîne — le contrôle l'a montré, c'est le test qui avait tort ;
    # (2) graphiti-core appelle CALL db.indexes(), qui N'EXISTE PAS sur un 5.x —
    # c'est delete_all_indexes, hors chemin d'écriture, mais la 001-5 doit le
