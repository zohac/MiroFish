  - id: "014"
    slug: integrite-preuves-redaction
    titre: "Intégrité des preuves de rédaction"
    statut: done
    plan: docs/plans/014-integrite-preuves-redaction
    depend_de: ["011", "012", "013"]
    pourquoi: >-
      La campagne de benchmark de l'Epic 013 a montré que l'écart entre
      `medium` et `high` ne porte pas sur la qualité de rédaction, mais sur
      un défaut de régime de preuve : le rapport peut présenter comme
      « événement simulé réel » une parole fabriquée pendant la rédaction,
      certifier une traçabilité que son propre registre nie, et attribuer un
      refus à un persona qui n'a jamais agi. Ces défauts sont communs aux deux
      efforts de raisonnement, donc indépendants du modèle.
    criteres_de_sortie:
      - "C1 : 100 % des passages issus d'un entretien de rédaction portent leur régime de provenance, et aucun n'est compté comme un événement du jeu figé"
      - "C2 : la section « Sources & Provenance » ne contient plus d'affirmation de traçabilité non calculée (prouvé par test sur un registre réel)"
      - "C3 : un persona silencieux ou non admis ne peut recevoir ni parole, ni décision, ni section, en prose comme au registre"
      - "C4 : la contradiction « persona silence ↔ action affirmée » déclenche un ÉCHEC de la barrière de publication, et non un avertissement"
      - "C5 : le brief et les fiches persona ne font plus diverger deux biographies de départ ; les fiches non admises sont hors du contexte de rédaction"
      - "C6 : un project.json corrompu n'affecte que son propre projet"
      - "C7 : un tiers recevant l'archive d'audit peut établir l'origine de chaque passage cité"
      - "C8 : filet de tests non régressé, et re-qualification sur R7 produisant un rapport sans certification mensongère"
