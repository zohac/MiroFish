  - id: "004"
    slug: bascule-sans-zep
    titre: "Construire un graphe en local sans clé Zep"
    statut: done
    plan: docs/plans/004-bascule-sans-zep
    depend_de: ["003"]
    pourquoi: >-
      Preuve finale : documents → graphe → personas → simulation → rapport,
      sans ZEP_API_KEY. C'est la définition de « local-first ». Paramétrabilité
      universelle du LLM via .env (endpoint, modèle, clé, effort de raisonnement)
      avec OpenCode Go space-bunny-free en environnement de référence.
    # Story 004-1 (DONE) : paramétrabilité universelle du LLM via .env (endpoint,
    # modèle, clé, effort de raisonnement). Intégration de LLM_REASONING_EFFORT dans Config,
    # alignement de la résolution des paramètres entre LLMClient et MiroFishLLMClient,
    # neutralité stricte prouvée (x-opencode-session émis UNIQUEMENT pour opencode.ai
    # et ses sous-domaines, en-têtes neutres pour les tiers OpenAI, DeepSeek, Groq, Ollama),
    # et suite de tests unitaires dédiée. Filet global porté à 577 tests verts (+15, revue BMad validée).
    # Story 004-2 (DONE) : levée des gardes ZEP_API_KEY dans les routes API et les services
    # métiers. Helper Config.requires_zep_api_key() posé, gardes bloquants 500 levés dans
    # api/graph.py (/build, /data, /delete) et api/simulation.py (/entities, /entities/<uuid>,
    # /entities/by-type) lorsque ZEP_BACKEND='graphiti', et non-régression Zep Cloud préservée.
    # GraphBuilderService, ZepEntityReader, OasisProfileGenerator, ZepGraphMemoryUpdater et
    # ZepToolsService s'instancient sans clé en mode graphiti. Suite de 24 tests unitaires et
    # d'API dédiée (test_zep_api_key_guards.py). Filet global porté à 601 tests verts (+24, revue BMad validée).
    # Story 004-3 (DONE) : ingestion et construction de graphe de bout en bout avec
    # GraphitiGraphStore et GraphBuilderService. Tâche asynchrone /api/graph/build validée
    # de bout en bout avec transitions d'état du projet (GRAPH_COMPLETED), TaskManager et
    # route de restitution GET /api/graph/data/<graph_id>. Banc d'ingestion réelle contre Neo4j
    # local validé (scripts/verifier_ingestion_graphiti.py) avec critère C3 formellement
    # satisfait (6 nœuds >= 5, 4 arêtes >= 3). Suite de 13 tests unitaires et de non-régression
    # (test_graph_builder_e2e.py, test_verifier_ingestion_graphiti.py). Revue BMad validée (5 patchs).
    # Filet global porté à 614 tests verts (+13).
    # Story 004-4 (DONE) : extraction d'entités, génération de personas et configuration
    # de simulation sans Zep. ZepEntityReader extrait les entités typées et arêtes sans Zep,
    # OasisProfileGenerator produit les profils personas Reddit JSON et Twitter CSV conformes
    # aux spécifications OASIS, et SimulationConfigGenerator génère simulation_config.json.
    # Route /api/simulation/create et méthode prepare_simulation opérationnelles sans clé Zep.
    # Banc de vérification réelle contre Neo4j local (scripts/verifier_personas_simulation_graphiti.py)
    # validé avec succès (critère C4 formellement satisfait : 4 personas >= 3, formats valides).
    # Suite de 10 nouveaux tests unitaires hermétiques (test_personas_simulation_graphiti.py,
    # test_verifier_personas_protocol.py). Revue BMad 4 couches validée avec 4 patchs appliqués. Filet global porté à 624 tests verts (+10).
    # Story 004-5 (DONE) : banc de qualification globale local-first (backend/scripts/verifier_qualification_local_first.py)
    # validant l'intégralité du cycle local-first sans clé Zep (100 % des critères C1 à C5 satisfaits) :
    # 0 blocage API (C1), paramétrabilité universelle LLM et neutralité d'hôte (C2), graphe Neo4j réel construit (6 nœuds, 4 arêtes, C3),
    # 6 personas Reddit JSON et Twitter CSV OASIS conformes et config de simulation complète (C4),
    # filet étendu à 632 tests unitaires et d'intégration hermétiques au vert (+8 tests, test_verifier_qualification_protocol.py et revue BMad 5 patchs) (C5).
    # Rapport de qualification consigné (rapport-qualification-epic-004.md) avec VERDICT GO. Epic 004 clos avec succès (5/5 stories done).


  - id: "005"
    slug: docker-local
    titre: "Environnement Docker de référence — Docker-first"
    statut: done
    plan: docs/plans/005-docker-local
    depend_de: ["001", "002", "003", "004"]
    pourquoi: >-
      Une seule commande doit lancer backend + frontend + Neo4j, avec volumes
      persistants et isolation stricte. ADR 0006 : un seul environnement de
      référence reproductible sans divergence avec l'hôte.
    # Story 005-1 (DONE) : Dockerfiles spécialisés pour le backend (backend/Dockerfile,
    # python:3.11-slim, uv 0.9.26, gcc/python3-dev pour compilation C/psutil, uv sync --locked,
    # locales partagées) et pour le frontend (frontend/Dockerfile, node:20-slim, corepack pnpm@10.23.0,
    # pnpm --dir frontend install --frozen-lockfile, locales partagées). Fichiers .dockerignore
    # consolidés à 3 niveaux (racine, backend, frontend) garantissant 0 secret et 0 artefact hôte.
    # Images mirofish-backend:local et mirofish-frontend:local construites avec succès via docker build
    # et validées en exécution réelle. Suite de 19 tests unitaires hermétiques (test_docker_build_config.py)
    # validée. Revue BMad 4 couches validée. Filet global porté à 651 tests verts (+19).
    # Story 005-2 (DONE) : docker-compose.yml unifié orchestrant les 3 services
    # (neo4j:5.26.31-community avec APOC débridé, heap 512m/1G, volumes nommés neo4j_data/neo4j_logs
    # et healthcheck Bolt cypher-shell ; backend Flask Python 3.11 sur bolt://neo4j:7687 avec healthcheck
    # HTTP /health ; frontend Vue 3 avec port paramétrable et target proxy dynamique vers BACKEND_URL)
    # sur réseau bridge mirofish_network avec ordonnancement strict (condition: service_healthy).
    # Zéro secret en clair, injection sécurisée via env_file pour backend.
    # Suite de 13 nouveaux tests unitaires hermétiques (test_docker_compose_config.py).
    # Revue BMad 4 couches validée. Filet global porté à 664 tests verts (+13).
    # Story 005-3 (DONE) : validation du filet global de tests (671 tests, 668 passants + 3 skipped
    # sous Docker, 671 passants sur hôte) et de l'outillage de qualité (ruff check ., validate_plans.py)
    # dans le conteneur de référence mirofish-backend:local. Inclusion des artefacts de gouvernance/docs
    # et de l'exception !.env.example dans .dockerignore (racine et backend). Adaptation de test_pyproject_override.py
    # pour environnement conteneurisé sans .git et test de repli dédié. Suite de 7 nouveaux tests unitaires
    # hermétiques (test_docker_tooling_parity.py, test_pyproject_override.py). Revue BMad 4 couches validée
    # (6 patchs appliqués). Filet global porté à 671 tests verts (+7).
    # Story 005-4 (DONE) : sonde de vérification autonome de persistance des données
    # Neo4j et cycle de vie des volumes (backend/scripts/verifier_persistance_neo4j_docker.py).
    # Preuve formelle de conformité au critère C3 du PRD : 100 % des nœuds et arêtes créés sont
    # préservés après un cycle docker compose down && docker compose up -d (sans -v). Preuve de purge
    # et réinitialisation complète lors de down -v. Préservation des montages bind (backend/uploads
    # et backend/simulations). Suite de 12 nouveaux tests unitaires hermétiques (test_docker_volume_persistence.py).
    # Revue BMad 4 couches validée (6 patchs appliqués). Filet global porté à 684 tests verts (+13).
    # Story 005-5 (DONE) : sonde d'orchestration de qualification Docker (backend/scripts/verifier_qualification_docker.py)
