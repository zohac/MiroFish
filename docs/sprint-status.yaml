epics:
  - id: "001"
    slug: epreuve-graphiti-local
    titre: "Épreuve Graphiti local — le modèle gratuit tient-il l'extraction ?"
    statut: done
    plan: docs/plans/001-epreuve-graphiti-local
    pourquoi: >-
      Seul point de rupture du projet : la qualité du structured output de
      space-bunny-free. Tant que ce n'est pas mesuré, tout le reste est
      spéculatif.
    criteres_de_sortie:
      - "27 chunks sur 30 extraits sans erreur (90 %), sur le rapport AN n° 2506"
      - "0 échec d'authentification (MissingSessionID) sur les appels LLM"
      - "graphe non vide, et relisible après redémarrage de Neo4j"
      - "verdict go / no-go écrit dans docs/STATUS.md"
    # Story 001-1 (done) : le conflit graphiti-core/camel-oasis est réel et
    # structurel — neo4j==5.23.0 est un pin exact que graphiti-core ne peut pas
    # satisfaire, son plancher étant >=5.26.0 (et l'inverse aussi : sentence-
    # transformers==3.0.0 vs >=3.2.1). Parade mesurée et rejouable : override
    # côté uv, un seul environnement, 192 tests verts à l'époque. Décision ACTÉE
    # par l'ADR 0010, précisée par l'ADR 0011.
    # Story 001-1b (done) : l'override est POSÉ, relu et corrigé.
    # pyproject.toml porte override-dependencies = ["neo4j>=5.26.0,<6.0.0"]
    # avec neo4j 5.28.6 en commentaire, graphiti-core==0.30.2 est en
    # dépendance produit SANS extra, et le lock est régénéré et commité.
    # Le protocole mesurer-001-1.sh a dû être réécrit : il exigeait
    # graphiti-core absent et ajoutait un second [tool.uv]. Il normalise
    # maintenant pyproject.toml dans l'état qu'il veut mesurer, refuse un
    # arbre ambigu, et a été rejoué sur les deux arbres — les deux sorties
    # sont versionnées. Revue par 4 couches : 5 findings bloquants, tous
    # corrigés (dont --frozen qui ne vérifiait pas le lock, et la télémétrie
    # posthog activée par défaut, désactivée depuis). 234 tests, +30 de
    # revue (204 au premier jet de la story).
    # Story 001-2 (DONE) : le driver forcé TIENT. Neo4j 5.26.31-
    # community dans un compose SÉPARÉ (docker-compose.neo4j.yml), tag figé sur
    # un patch, écart driver 5.28.6 / serveur 5.26.31 consigné et gardé par un
    # test. 17 contrôles, deux fois : surface de l'ADR 0011 EXERCÉE (pas
    # importée), hiérarchie d'exceptions comprise, et le nœud survit à stop puis
    # start — C3 prouvé pour la moitié qui ne dépend pas de l'extraction.
    # L'ADR 0010 N'EST PAS SUPERSÉDÉ.
    # Trois trouvailles : (1) Neo4jError et DriverError sont SOeurs sous GqlError,
    # pas une chaîne — le contrôle l'a montré, c'est le test qui avait tort ;
    # (2) graphiti-core appelle CALL db.indexes(), qui N'EXISTE PAS sur un 5.x —
    # c'est delete_all_indexes, hors chemin d'écriture, mais la 001-5 doit le
    # savoir avant de choisir sa remise à zéro ; (3) APOC a DEUX réponses, pas
    # une : graphiti-core s'en passe (zéro occurrence dans le paquet), camel-oasis
    # en a besoin (apoc.meta.data au __init__, apoc.merge.node à l'écriture) — le
    # plugin reste, pour la raison que architecture.md §4 ne donnait pas. Corrigé
    # aussi : apoc.merge.* est refusé par défaut même plugin installé.
    # 277 tests (+42). Les tests d'intégration ne sont pas en CI : ils lisent le
    # compose et les deux sorties versionnées, la preuve d'exécution reste
    # rejouable à la main.
    # 001-2 relue par 4 couches : 28 correctifs, dont six garde-fous morts et un C3
    # qui ne tenait que par coïncidence. 279 tests (+45). Mesures rejouées.
    # Story 001-3 (DONE) : MiroFishLLMClient implémenté, validé et relu.
    # OpenAIGenericClient sous-classé avec injection de default_headers
    # (x-opencode-session, User-Agent), neutralité préservée (base_url=None), mode
    # structured_output_mode="json_object" par défaut, filtrage des balises <think>
    # et transmission de LLM_REASONING_EFFORT via extra_body. Sonde de
    # vérification autonome fiabilisée (scripts/verifier_llm_graphiti.py). Critère C2
    # validé (0 échec MissingSessionID). Revue 4 couches passée (6 correctifs).
    # 296 tests (+17).
    # Story 001-4 (DONE) : SentenceTransformerEmbedder implémenté et validé.
    # Adaptateur local sous-classant EmbedderClient sans extra ni conflit
    # (sentence-transformers==3.0.0 déjà fourni par camel-oasis). Modèle par défaut
    # all-MiniLM-L6-v2 (384 dim, 0 € marginal), lazy-loading thread-safe, délégation
    # asynchrone via asyncio.to_thread, conversion rigoureuse en list[float]. Sonde
    # autonome de vérification (scripts/verifier_embedder_graphiti.py) avec mode --mock
    # et intégration conjointe Graphiti sans clé OpenAI validées. Revue de code
    # contradictoire passée (4 couches, 6 correctifs). 315 tests (+18).
    # Story 001-5 (DONE) : banc de mesure autonome (scripts/mesurer_extraction_graphiti.py)
    # exécuté en conditions réelles sur les 30 premiers chunks du rapport AN n° 2506
    # avec space-bunny, all-MiniLM-L6-v2 et Neo4j 5.26. Résultats : C1 = 29/30 (96.7 % >= 90 %),
    # C2 = 0 échec MissingSessionID, C3 = 49 nœuds et 45 relations persistés et relus,
    # C4 = 11 arêtes avec valid_at renseigné, C5 = rapport.md versionné avec verdict GO.
    # Revue BMad 4 couches validée (8 patchs appliqués). 333 tests (+18).
    # Story 001-6 (DONE) : verdict formel GO documenté dans docs/STATUS.md et clôture
    # de l'epic 001. Hypothèse confirmée : extraction fonctionnelle à coût marginal 0 €.
    # Synchronisation complète de la documentation d'état et des référentiels.
    # Epic 001 clos, Epic 002 débloqué pour cadrage et démarrage.
    # Le détail des stories vit dans docs/plans/001-epreuve-graphiti-local/ :
    # epic-001.md pour l'index, story-001-<n>.md pour une story démarrée.
    # Ici on ne garde que l'agrégat d'epic (ADR 0007).

