    # group_id = graph_id sur 100 % des requêtes Cypher et 24 nouveaux tests
    # unitaires hermétiques dans test_graphiti_graph_store.py (74 tests sur le fichier).
    # Revue BMad 4 couches validée (6 patchs appliqués). Filet global porté à 545 tests verts (+24).
    # Story 003-4 (DONE) : adaptation de la lecture d'entités (zep_entity_reader.py,
    # EntityNode, GraphNode) pour supporter le typage agnostique et les entités
    # génériques Graphiti (:Entity). Levée du filtrage aveugle qui rejetait 100 % des nœuds
    # Graphiti, chaîne de résolution ordonnée de get_entity_type (labels spécifiques > attributs > Entity),
    # filtrage filter_defined_entities avec ou sans defined_entity_types, compatibilité avec
    # simulation_config_generator et oasis_profile_generator. 10 nouveaux tests unitaires hermétiques
    # dédiés (test_zep_entity_reader_graphiti.py). Revue BMad validée (3 patchs appliqués). Filet global porté à 555 tests verts (+10).
    # Story 003-5 (DONE) : banc d'intégration réelle (backend/scripts/verifier_integration_graphiti.py)
    # validé sur l'instance Neo4j locale (docker-compose.neo4j.yml). 100 % des 14 méthodes du contrat
    # GraphStore exercées avec succès (C1), partitionnement multi-tenant étanche prouvé (0 fuite, C2),
